<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Minik Yürekler Anaokulu</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Nunito',sans-serif;
      height:100vh;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(-45deg,#ffb6c1,#ffd166,#a0e7e5,#b4f8c8);
      background-size: 400% 400%;
      animation: bgMove 12s ease infinite;
      position:relative;
    }

    @keyframes bgMove{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    /* Baloncuklar */
    .bubble{
      position:absolute;
      bottom:-120px;
      background:rgba(255,255,255,0.25);
      border-radius:50%;
      animation: float linear infinite;
      backdrop-filter: blur(4px);
    }

    @keyframes float{
      0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
      }
      10%{
        opacity:1;
      }
      100%{
        transform:translateY(-120vh) rotate(360deg);
        opacity:0;
      }
    }

    .container{
      width:90%;
      max-width:700px;
      text-align:center;
      padding:50px 35px;
      border-radius:30px;
      background:rgba(255,255,255,0.18);
      backdrop-filter: blur(14px);
      box-shadow:0 8px 40px rgba(0,0,0,0.15);
      animation: fadeUp 1.2s ease;
      z-index:2;
    }

    @keyframes fadeUp{
      from{
        opacity:0;
        transform:translateY(40px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .logo{
      font-size:70px;
      animation: bounce 2.5s infinite;
      margin-bottom:10px;
    }

    @keyframes bounce{
      0%,100%{
        transform:translateY(0);
      }
      50%{
        transform:translateY(-12px);
      }
    }

    h1{
      font-size:48px;
      color:#fff;
      font-weight:900;
      text-shadow:0 4px 10px rgba(0,0,0,0.15);
      margin-bottom:15px;
    }

    .subtitle{
      font-size:28px;
      color:#fff;
      font-weight:700;
      margin-bottom:20px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse{
      0%{opacity:0.7;}
      50%{opacity:1;}
      100%{opacity:0.7;}
    }

    p{
      color:#fff;
      font-size:18px;
      line-height:1.7;
      opacity:0.95;
    }

    .line{
      width:120px;
      height:5px;
      margin:25px auto;
      border-radius:20px;
      background:#fff;
      animation: lineAnim 3s infinite;
    }

    @keyframes lineAnim{
      0%{width:80px;}
      50%{width:160px;}
      100%{width:80px;}
    }

    .footer{
      margin-top:30px;
      color:#fff;
      font-size:15px;
      opacity:0.85;
    }

    @media(max-width:600px){
      h1{
        font-size:34px;
      }

      .subtitle{
        font-size:22px;
      }

      p{
        font-size:16px;
      }

      .logo{
        font-size:55px;
      }
    }
  </style>
</head>
<body>

  <!-- Baloncuklar -->
  <div class="bubble" style="left:10%; width:60px; height:60px; animation-duration:12s;"></div>
  <div class="bubble" style="left:25%; width:30px; height:30px; animation-duration:9s;"></div>
  <div class="bubble" style="left:40%; width:90px; height:90px; animation-duration:16s;"></div>
  <div class="bubble" style="left:55%; width:45px; height:45px; animation-duration:11s;"></div>
  <div class="bubble" style="left:70%; width:70px; height:70px; animation-duration:14s;"></div>
  <div class="bubble" style="left:85%; width:35px; height:35px; animation-duration:10s;"></div>

  <div class="container">
    <div class="logo">🎈</div>

    <h1>Minik Yürekler Anaokulu</h1>

    <div class="line"></div>

    <div class="subtitle">
      Yakında Hizmetinizdedir ✨
    </div>

    <p>
      Sevgi dolu, güvenli ve eğlenceli bir eğitim dünyası çok yakında sizlerle.
      Minik kalpler için büyük hayaller kuruyoruz 💛
    </p>

    <div class="footer">
      © 2026 Minik Yürekler Anaokulu
    </div>
  </div>

</body>
</html>
